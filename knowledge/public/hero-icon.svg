  <defs>
    <!-- 全图共用一条 45 度斜向渐变（左上到右下），封面 / 原子轨道 / 笔记线方向统一。
         颜色取 hero-ink-1 与 hero-ink-2 两个变量：彩虹模式下由 :root 动画逐帧驱动，
         开关关闭时回退为当前主题色。
         注意：本注释内不得出现连续双连字符，否则 SVG 作为 img 加载时 XML 解析失败。 -->
    <linearGradient id="ink" x1="88" y1="72" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--hero-ink-1, #586FD0)"/>
      <stop offset="0.55" stop-color="color-mix(in srgb, var(--hero-ink-1, #586FD0) 55%, var(--hero-ink-2, #6D7BFF))"/>
      <stop offset="1" stop-color="var(--hero-ink-2, #6D7BFF)"/>
    </linearGradient>
    <!-- 纸张白：不参与主题色，保持不变 -->
    <linearGradient id="paper" x1="150.9" y1="83" x2="420.48" y2="119.517" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="0.55" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
</svg>
